############ Theme: catppuccin/tmux engine + palette from ~/.config/themes/ ############
# Adds catppuccin/tmux plugin (managed by tpm). Run `prefix + I` once to install.
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Status bar layout (works for any palette)
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-interval 5

# Catppuccin/tmux v2 module config
set -g @catppuccin_window_status_style "slanted"
# Active window number chip uses lavender (bright purple #bd5eff in cyberdream)
# instead of the default mauve (pink-magenta #ff5ef1) — closer match to the
# vivid purple seen in nvim's syntax highlighting / mode indicator.
set -g @catppuccin_window_current_number_color "#{@thm_lavender}"
# Unset the current-window separators so catppuccin's `-o` (only-if-unset) flag
# re-populates them from the active style. Without this, separators stay frozen
# at whatever style was loaded on the FIRST tmux startup.
set -gqu @catppuccin_window_current_left_separator
set -gqu @catppuccin_window_current_middle_separator
set -gqu @catppuccin_window_current_right_separator

# Slanted separators for status modules (session/host/date_time chips).
# These are independent of @catppuccin_window_status_style and default to blanks,
# which is why the right-side modules looked rounded next to slanted windows.
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_connect_separator "no"

# Window text: just show window name (#W). With `allow-rename off` and `automatic-rename on`,
# #W is the current command for un-renamed windows, or your manual name for renamed ones.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Session module lives at the far right (after date_time) so its chip can't be
# mistaken for a window/tab. Status-left is empty so windows start at column 0.
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_session}"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

# Theme palette: read from currently selected theme directory
# (theme-switch script writes the name to ~/.config/themes/current)
if-shell '[ -f ~/.config/themes/current ]' \
  'run-shell "tmux source-file ~/.config/themes/$(cat ~/.config/themes/current)/tmux.conf"' \
  'source-file ~/.config/themes/cyberdream/tmux.conf'

# Window naming: keep names short ("nvim", "zsh"), don't let programs override
set -g allow-rename off
setw -g automatic-rename on

# Theme picker: prefix + T opens fzf in a tmux popup
bind-key T display-popup -E -w 50 -h 18 "theme-switch"

# For tmux-logging
set -g @logging_key 'C-]'


new-session -A -s default  # -A = attach if exists; prevents spawning duplicate sessions on `prefix+r`
# Change prefix to ctrl-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'

bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

bind -n M-H if-shell "$is_vim" "send-keys M-H" "resize-pane -L 10"
bind -n M-L if-shell "$is_vim" "send-keys M-L" "resize-pane -R 10"
bind -n M-K if-shell "$is_vim" "send-keys M-K" "resize-pane -U 5"
bind -n M-J if-shell "$is_vim" "send-keys M-J" "resize-pane -D 5"

bind-key N swap-window -t +1\; select-window -t +1
bind-key P swap-window -t -1\; select-window -t -1

# Switch sessions with prefix + arrow up/down
bind-key Up switch-client -p
bind-key Down switch-client -n

bind -n 'M-1' switch-client -T macros

bind -T macros x new-window
bind -T macros d select-pane -d
bind -T macros e select-pane -e


bind -n M-u attach-session -t . -c '~/code'


# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Make the first window number start at 1
set -g base-index 1

# Make pane numbering consistent wi# For tmux-lth windows
setw -g pane-base-index 1
set -sg escape-time 20

# Renumber windows when a window is closed
# This guarantees it will be easier for you to switch
# between windows as you keep opening and closing them
set -g renumber-windows on

# Vi-mode keys
setw -g mode-keys vi
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi C-v send-keys -X rectangle-on \; send -X begin-selection
bind-key -T copy-mode-vi v send-keys -X rectangle-off \; send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X rectangle-toggle

# Turn on mouse support
set -g mouse on

set -g allow-passthrough on

# Turn on clipboard support
set -g set-clipboard on

# Remap choose-tree keys so items are numbered 1-9 instead of 0-8
CHOOSE_TREE_KEYS='#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{e|<:#{line},36},M-#{a:#{e|+:97,#{e|-:#{line},10}}},}}'

# move windows to session
bind-key m choose-tree -s -K "$CHOOSE_TREE_KEYS" "move-window -t '%%'"

# session picker with 1-based numbering
bind-key s choose-tree -s -Z -K "$CHOOSE_TREE_KEYS"

# move window to session AND switch to it
bind-key M choose-tree -s -K "$CHOOSE_TREE_KEYS" "run-shell 'tmux move-window -t \"%%\" && tmux switch-client -t \"%%\"'"

# "Backburner" toggle: prefix+b shoves the current window to the dedicated
# `park` session (stamping where it came from) and keeps you working. Hit
# prefix+b again from inside `park` to send that window back to its origin and
# follow it. See ~/.local/bin/tmux-park-toggle.
bind-key b run-shell "~/.local/bin/tmux-park-toggle"

# prefix+B: jump to the `park` session (and back). From park, returns to the
# last session you were in; from anywhere else, switches into park.
bind-key B if-shell '[ "#{session_name}" = "park" ]' \
    'switch-client -l' \
    'if-shell "tmux has-session -t =park" "switch-client -t park" "display-message \"park: nothing parked\""'

# Improve colors
# set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-256color:RGB"

# Fix EventFocus/EventLost events in ViM and others
# https://github.com/tmux-plugins/vim-tmux-focus-events
set -g focus-events on

# Increase scrollback buffer
set -g history-limit 40000

# Custom view for tmux-sidebar plugin
set -g @sidebar-tree-command 'tree -C -L 1'

# Restore window contents on session restore
set -g @resurrect-capture-pane-contents 'on'

# Restore shell history on tmux session restore
set -g @resurrect-save-shell-history 'on'

# set-option -g default-command "reattach-to-user-namespace -l zsh"
set-option -g default-shell ${SHELL}

bind-key v 'capture-pane' \; \
  capture-pane -S - \; \
  save-buffer /tmp/tmux \; \
  delete-buffer \; \
  popup -E "nvim /tmp/tmux"
  # send-keys Escape 'vvim /tmp/tmux' Enter


set -g @yank_action 'copy-pipe' # or 'copy-pipe-and-cancel' for the default

#### Plugins #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
#set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-urlview' # prefix + u
set -g @plugin 'jbnicolai/tmux-fpp'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jhonrocha/tmux-copy-output'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Session restore after reboot (resurrect + continuum) ---
# continuum auto-saves on a timer and auto-restores when the tmux server first
# starts (i.e. after a reboot, the first time you launch tmux). Pane scrollback
# is captured via @resurrect-capture-pane-contents (set above).
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'   # minutes; lower = less lost on a hard reboot, more disk churn

# Strict allow-list of programs to relaunch on restore. @resurrect-processes
# only ADDS to a built-in default list (vi/vim/nvim/less/top/htop/man/...), so
# we ALSO override @resurrect-default-processes to wipe that default — otherwise
# less/top/htop/ssh/etc. would be relaunched too. Result: ONLY these come back.
set -g @resurrect-default-processes 'vim view nvim'
set -g @resurrect-processes '"~claude" "~lazygit"'

# Restore files open in nvim. Needs tpope/vim-obsession installed inside nvim to
# fully restore the buffer set; without it nvim just relaunches empty.
set -g @resurrect-strategy-nvim 'session'

set -g @tco-copy 'pbcopy'








